version: '3.8'

services:
  wav2lip:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # If running on CPU (e.g. local Mac without NVIDIA GPU), comment out the 'deploy' section above.
